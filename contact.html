<section class="contact-section">
  <h2>Contact Waterford Fishing Charter</h2>
  <p>Have questions about our fishing trips? Send us a message!</p>

  <form action="https://formspree.io/f/xgaawpdl" method="POST">

    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" name="firstName"
           required minlength="2" maxlength="30">

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" name="lastName"
           required minlength="2" maxlength="30">

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone">

    <label for="message">Message:</label>
    <textarea id="message" name="message"
              rows="5" required minlength="10"
              maxlength="500"></textarea>

    <!-- Dropdown selection -->
    <fieldset>
      <legend>Best Time to Reach You</legend>

      <label for="contactTime">Choose a time:</label>
      <select id="contactTime" name="contactTime" required>
        <option value="">Select a time</option>
        <option value="morning">Morning</option>
        <option value="afternoon">Afternoon</option>
        <option value="evening">Evening</option>
      </select>
    </fieldset>

    <!-- Radio buttons -->
    <fieldset>
      <legend>Best Way to Reach You</legend>

      <label>
        <input type="radio" name="contactMethod"
               value="email" required>
        Email
      </label>

      <label>
        <input type="radio" name="contactMethod"
               value="phone">
        Phone
      </label>
    </fieldset>

    <!-- Checkboxes -->
    <fieldset>
      <legend>What Would You Like to Know About?</legend>

      <label>
        <input type="checkbox" name="interests"
               value="fishingTrips">
        Fishing Trips
      </label>

      <label>
        <input type="checkbox" name="interests"
               value="pricing">
        Pricing
      </label>

      <label>
        <input type="checkbox" name="interests"
               value="availability">
        Availability
      </label>
    </fieldset>

    <button type="submit">Send Message</button>

  </form>
</section>
